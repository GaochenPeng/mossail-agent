[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "open-repo-agent-service"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.139.2",
    "uvicorn==0.52.1",
    "open-repo-agent-runtime",
    "open-repo-protocol",
    "PyJWT[crypto]>=2.10,<3",
    "asyncpg>=0.30,<1",
    "redis>=5,<8",
    "jsonpatch>=1.33,<2",
    "websockets>=15,<17",
]

[dependency-groups]
dev = ["pytest>=9,<10", "pytest-asyncio>=1.4,<2"]

[tool.uv.sources]
open-repo-agent-runtime = {path = "../../packages/agent-runtime", editable = true}
open-repo-protocol = {path = "../../packages/protocol", editable = true}

[tool.hatch.build.targets.wheel]
packages = ["src/agent_service"]
